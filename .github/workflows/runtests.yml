name: Run tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"

    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Tk on a headless Linux runner needs a virtual X server. The
      # ``xvfb`` package ships ``xvfb-run`` which is the cheapest way
      # to give ``smoke_test.py`` a display without adding any Python
      # dependencies.
      - name: "Install Xvfb for the GUI smoke test"
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install tn-venv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install tn-venv
      - name: "Run main tests"
        run: |
          python run_tests.py

